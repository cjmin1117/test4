<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>스마트 2인 모둠 & 좌석배치표</title>
  <!-- html2canvas 라이브러리 (이미지 저장용) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Pretendard', 'Segoe UI', sans-serif;
      background-color: #f0f4f8;
      color: #333;
      padding: 30px 15px;
    }
    .container {
      max-width: 950px;
      margin: 0 auto;
      background: #ffffff;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
    }
    header { text-align: center; margin-bottom: 25px; padding-bottom: 15px; border-bottom: 2px dashed #e2e8f0; }
    h1 { font-size: 1.8rem; color: #1e293b; }

    /* 환경 설정 제어판 */
    .config-panel {
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 25px;
    }
    .config-title { font-size: 1rem; font-weight: bold; color: #1e293b; margin-bottom: 15px; }
    .config-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
      margin-bottom: 15px;
    }
    .config-group { display: flex; flex-direction: column; gap: 5px; }
    .config-group label { font-size: 0.85rem; font-weight: bold; color: #475569; }
    .config-group input { padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.9rem; }

    /* 같은 조 방지 규칙 섹션 */
    .rule-section {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 15px;
    }
    .rule-input-group {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-top: 8px;
    }
    .rule-input-group input {
      width: 80px;
      padding: 6px;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      text-align: center;
    }
    .rule-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }
    .rule-chip {
      background: #fee2e2;
      color: #991b1b;
      padding: 4px 10px;
      border-radius: 16px;
      font-size: 0.85rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .rule-chip button {
      background: none;
      border: none;
      color: #991b1b;
      cursor: pointer;
      font-weight: bold;
    }

    /* 명단 입력 섹션 */
    .student-section { border-top: 1px solid #e2e8f0; padding-top: 15px; }
    .btn-group-sm { display: flex; gap: 6px; }
    .btn-sm {
      font-size: 0.8rem;
      padding: 4px 10px;
      border-radius: 4px;
      border: 1px solid #cbd5e1;
      background-color: #ffffff;
      color: #334155;
      cursor: pointer;
      font-weight: 600;
    }
    .btn-sm.btn-primary { background-color: #10b981; color: white; border-color: #059669; }
    .btn-sm.btn-toggle { background-color: #e0e7ff; color: #3730a3; border-color: #c7d2fe; }

    .name-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 10px;
      max-height: 180px;
      overflow-y: auto;
      padding-right: 5px;
      margin-top: 10px;
    }
    .name-input-group {
      display: flex;
      align-items: center;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      padding: 4px 8px;
    }
    .name-input-group label { font-size: 0.85rem; font-weight: bold; color: #3b82f6; width: 42px; flex-shrink: 0; }
    .name-input-group input { width: 100%; border: none; outline: none; font-size: 0.9rem; font-weight: 600; }

    .btn-wrapper { text-align: center; margin: 25px 0; display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
    .btn-main {
      background-color: #3b82f6; color: white; border: none;
      padding: 12px 28px; font-size: 1rem; font-weight: bold;
      border-radius: 50px; cursor: pointer;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
      transition: all 0.2s;
    }
    .btn-main.secondary { background-color: #64748b; box-shadow: 0 4px 12px rgba(100, 116, 139, 0.3); }
    .btn-main:hover { transform: translateY(-1px); }

    /* 동적 Grid 레이아웃 및 칠판 영역 */
    .blackboard {
      background: #1e293b;
      color: white;
      text-align: center;
      padding: 8px;
      border-radius: 8px;
      font-weight: bold;
      margin-bottom: 12px;
      margin-top: 12px;
      letter-spacing: 2px;
    }
    .swap-guide {
      text-align: center;
      font-size: 0.85rem;
      color: #64748b;
      margin-bottom: 15px;
      font-weight: 600;
    }
    .print-area { display: flex; flex-direction: column; padding: 20px; background: white; border-radius: 12px; }
    .result-grid { display: grid; gap: 16px; }

    .group-card {
      background: #ffffff; border: 1px solid #cbd5e1;
      border-radius: 12px; padding: 14px; box-shadow: 0 2px 5px rgba(0,0,0,0.02);
    }
    .group-card.solo { border-color: #f59e0b; background-color: #fffbe0; }

    .group-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 10px; padding-bottom: 6px; border-bottom: 2px solid #3b82f6;
    }
    .group-card.solo .group-header { border-bottom-color: #f59e0b; }
    .group-title { font-size: 1rem; font-weight: bold; color: #1e293b; }
    .badge {
      font-size: 0.75rem; padding: 2px 7px; border-radius: 12px;
      font-weight: bold; background-color: #e0f2fe; color: #0369a1;
    }

    .seats-container { display: flex; gap: 8px; }
    .seat {
      flex: 1; background: #f1f5f9; border: 1px solid #cbd5e1;
      border-radius: 8px; padding: 8px 4px; text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      user-select: none;
    }
    .seat:hover {
      border-color: #3b82f6;
      background: #eff6ff;
    }
    /* 맞교환 선택 시 효과 */
    .seat.selected {
      background: #dbeafe !important;
      border: 2px solid #2563eb !important;
      box-shadow: 0 0 8px rgba(37, 99, 235, 0.4);
      transform: scale(1.03);
    }
    .seat-label { font-size: 0.75rem; font-weight: bold; color: #64748b; margin-bottom: 4px; }
    .seat-num { font-size: 0.8rem; color: #3b82f6; font-weight: bold; }
    .seat-name { font-size: 0.95rem; font-weight: bold; color: #1e293b; margin-top: 2px; }

    .seat.single { background: #fef3c7; border-color: #fcd34d; }
    .seat.single .seat-label, .seat.single .seat-num { color: #d97706; }

    @media print {
      body * { visibility: hidden; }
      .print-area, .print-area * { visibility: visible; }
      .print-area { position: absolute; left: 0; top: 0; width: 100%; }
      .swap-guide { display: none; }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>🎲 스마트 2인 모둠 & 좌석배치표</h1>
    </header>

    <div class="config-panel">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
        <div class="config-title" style="margin-bottom: 0;">⚙️ 환경 설정</div>
        <button class="btn-sm btn-toggle" id="btnToggleBoard" onclick="App.toggleBlackboard()">🔄 칠판 위치: 앞(전면)</button>
      </div>

      <div class="config-grid">
        <div class="config-group">
          <label for="cfg-max-num">전체 끝 번호</label>
          <input type="number" id="cfg-max-num" value="25" min="1" onchange="App.initInputs()">
        </div>
        <div class="config-group">
          <label for="cfg-excluded">결번 (쉼표 구분)</label>
          <input type="text" id="cfg-excluded" value="" placeholder="예: 2, 14" onchange="App.initInputs()">
        </div>
        <div class="config-group">
          <label for="cfg-cols">가로 열 개수 (Grid)</label>
          <input type="number" id="cfg-cols" value="3" min="1" onchange="App.renderGrid()">
        </div>
      </div>

      <!-- 같은 조 방지 설정 -->
      <div class="rule-section">
        <label style="font-size: 0.85rem; font-weight: bold; color: #dc2626;">🚫 같은 조 방지 지정 (분리 대상)</label>
        <div class="rule-input-group">
          <input type="number" id="rule-a" placeholder="번호A">
          <span>-</span>
          <input type="number" id="rule-b" placeholder="번호B">
          <button class="btn-sm" onclick="App.addBanRule()">규칙 추가</button>
        </div>
        <div class="rule-list" id="ruleList"></div>
      </div>

      <!-- 명단 관리 -->
      <div class="student-section">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <label style="font-size: 0.9rem; font-weight: bold; color: #334155;">📋 학생 명단 입력</label>
          <div class="btn-group-sm">
            <button class="btn-sm btn-primary" onclick="App.saveNames()">💾 명단 저장</button>
            <button class="btn-sm" onclick="App.fillSampleNames()">샘플 채우기</button>
          </div>
        </div>
        <div class="name-grid" id="nameInputs"></div>
      </div>
    </div>

    <div class="btn-wrapper">
      <button class="btn-main" onclick="App.run()">🎲 자리 배치하기</button>
      <button class="btn-main secondary" onclick="App.downloadPNG()">🖼️ 이미지 저장 (PNG)</button>
      <button class="btn-main secondary" onclick="window.print()">🖨️ 인쇄하기</button>
    </div>

    <!-- 출력 영역 -->
    <div class="print-area" id="captureArea">
      <div class="blackboard" id="blackboard" style="order: 1;">칠 판 (앞)</div>
      <div class="swap-guide" style="order: 2;">💡 자리를 바꿀 두 학생의 책상을 순서대로 클릭하면 위치가 서로 교환됩니다.</div>
      <div class="result-grid" id="resultGrid" style="order: 3;"></div>
    </div>
  </div>

  <script>
    const App = {
      banRules: [],
      currentPairs: [], // 현재 배치 데이터 보존
      selectedSeat: null, // 맞교환용 첫 번째 선택 좌석 {groupIndex, seatIndex}
      isBoardFront: true, // 칠판 위치 상태 (true: 앞, false: 뒤)

      getExcludedList: function() {
        const input = document.getElementById('cfg-excluded').value;
        return input.split(',').map(n => parseInt(n.trim())).filter(n => !isNaN(n));
      },

      initInputs: function() {
        const maxNum = parseInt(document.getElementById('cfg-max-num').value) || 0;
        const excluded = this.getExcludedList();
        const container = document.getElementById('nameInputs');
        const saved = JSON.parse(localStorage.getItem('StudentNames') || '{}');

        container.innerHTML = '';
        for (let i = 1; i <= maxNum; i++) {
          if (!excluded.includes(i)) {
            const val = saved[i] !== undefined ? saved[i] : `학생${i}`;
            const div = document.createElement('div');
            div.className = 'name-input-group';
            div.innerHTML = `<label>${i}번</label><input type="text" id="student-${i}" value="${val}">`;
            container.appendChild(div);
          }
        }
      },

      saveNames: function() {
        const maxNum = parseInt(document.getElementById('cfg-max-num').value) || 0;
        const saved = {};
        for (let i = 1; i <= maxNum; i++) {
          const input = document.getElementById(`student-${i}`);
          if (input) saved[i] = input.value.trim();
        }
        localStorage.setItem('StudentNames', JSON.stringify(saved));
        alert('명단이 저장되었습니다!');
      },

      fillSampleNames: function() {
        const samples = ["김철수", "이영희", "박민수", "정수진", "최동현", "강민준", "윤서연", "임지호", "한예은", "오성민", "신유진", "백현우", "서아윤", "송준혁", "유지우", "조현우", "전서현", "고도윤", "문하은", "양지민"];
        const maxNum = parseInt(document.getElementById('cfg-max-num').value) || 0;
        let idx = 0;
        for (let i = 1; i <= maxNum; i++) {
          const input = document.getElementById(`student-${i}`);
          if (input) { input.value = samples[idx % samples.length]; idx++; }
        }
      },

      addBanRule: function() {
        const a = parseInt(document.getElementById('rule-a').value);
        const b = parseInt(document.getElementById('rule-b').value);
        if (a && b && a !== b) {
          this.banRules.push([Math.min(a, b), Math.max(a, b)]);
          document.getElementById('rule-a').value = '';
          document.getElementById('rule-b').value = '';
          this.renderRules();
        }
      },

      removeBanRule: function(idx) {
        this.banRules.splice(idx, 1);
        this.renderRules();
      },

      renderRules: function() {
        const list = document.getElementById('ruleList');
        list.innerHTML = this.banRules.map((r, i) => 
          `<div class="rule-chip">${r[0]}번 - ${r[1]}번 금지 <button onclick="App.removeBanRule(${i})">✕</button></div>`
        ).join('');
      },

      // 칠판 위치 전면/후면 토글 및 좌석배치표 상하 대칭 반전
      toggleBlackboard: function() {
        this.isBoardFront = !this.isBoardFront;
        const boardEl = document.getElementById('blackboard');
        const btnEl = document.getElementById('btnToggleBoard');

        if (this.isBoardFront) {
          boardEl.style.order = '1';
          boardEl.innerText = '칠 판 (앞)';
          btnEl.innerText = '🔄 칠판 위치: 앞(전면)';
        } else {
          boardEl.style.order = '4';
          boardEl.innerText = '칠 판 (뒤)';
          btnEl.innerText = '🔄 칠판 위치: 뒤(후면)';
        }
        
        // 칠판 위치에 따라 모둠 배치 재렌더링
        this.renderGrid();
      },

      isValidPlacement: function(pairs) {
        for (let pair of pairs) {
          if (pair.length < 2) continue;
          const numA = pair[0].rawNum;
          const numB = pair[1].rawNum;
          for (let rule of this.banRules) {
            if ((rule[0] === numA && rule[1] === numB) || (rule[0] === numB && rule[1] === numA)) {
              return false;
            }
          }
        }
        return true;
      },

      run: function() {
        const maxNum = parseInt(document.getElementById('cfg-max-num').value) || 0;
        const excluded = this.getExcludedList();

        let members = [];
        for (let i = 1; i <= maxNum; i++) {
          if (!excluded.includes(i)) {
            const input = document.getElementById(`student-${i}`);
            members.push({ rawNum: i, num: `${i}번`, name: input ? input.value : `학생${i}` });
          }
        }

        let pairs = [];
        let attempts = 0;
        let valid = false;

        while (attempts < 500 && !valid) {
          attempts++;
          let shuffled = [...members].sort(() => Math.random() - 0.5);
          pairs = [];
          for (let i = 0; i < shuffled.length; i += 2) {
            if (i + 1 < shuffled.length) pairs.push([shuffled[i], shuffled[i+1]]);
            else pairs.push([shuffled[i]]);
          }
          if (this.isValidPlacement(pairs)) valid = true;
        }

        if (!valid) {
          alert('설정한 금지 규칙 조건을 만족하는 배치를 찾기 어렵습니다. 규칙을 완화해 주세요.');
          return;
        }

        this.currentPairs = pairs;
        this.selectedSeat = null;
        this.renderGrid();
      },

      // 자리를 클릭했을 때 맞교환 처리
      handleSeatClick: function(gIdx, sIdx) {
        if (this.selectedSeat && this.selectedSeat.gIdx === gIdx && this.selectedSeat.sIdx === sIdx) {
          this.selectedSeat = null;
          this.renderGrid();
          return;
        }

        if (!this.selectedSeat) {
          this.selectedSeat = { gIdx, sIdx };
          this.renderGrid();
        } else {
          const first = this.currentPairs[this.selectedSeat.gIdx][this.selectedSeat.sIdx];
          const second = this.currentPairs[gIdx][sIdx];

          this.currentPairs[this.selectedSeat.gIdx][this.selectedSeat.sIdx] = second;
          this.currentPairs[gIdx][sIdx] = first;

          this.selectedSeat = null;
          this.renderGrid();
        }
      },

      // 화면 출력 (칠판 위치에 따른 상하 대칭 행 배치 적용)
      renderGrid: function() {
        const cols = parseInt(document.getElementById('cfg-cols').value) || 3;
        const resultGrid = document.getElementById('resultGrid');
        resultGrid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
        resultGrid.innerHTML = '';

        const totalGroups = this.currentPairs.length;
        const totalRows = Math.ceil(totalGroups / cols);

        this.currentPairs.forEach((group, gIdx) => {
          const card = document.createElement('div');
          card.className = `group-card ${group.length === 1 ? 'solo' : ''}`;

          // 가로/세로 Grid 위치 계산
          const originalRow = Math.floor(gIdx / cols) + 1; // 1부터 시작하는 기본 행 번호
          const colPos = (gIdx % cols) + 1;

          // 칠판이 뒤로 가면 행(Row) 순서를 상하 반전 (시작 행을 바닥으로)
          const targetRow = this.isBoardFront ? originalRow : (totalRows - originalRow + 1);

          card.style.gridRow = targetRow;
          
          // 단독 1명인 그룹이 마지막 줄일 때 중앙 배치 처리
          if (group.length === 1 && gIdx === totalGroups - 1 && (totalGroups % cols !== 0)) {
            const centerCol = Math.ceil(cols / 2);
            card.style.gridColumn = centerCol;
          } else {
            card.style.gridColumn = colPos;
          }

          if (group.length === 2) {
            const isSelected0 = this.selectedSeat && this.selectedSeat.gIdx === gIdx && this.selectedSeat.sIdx === 0;
            const isSelected1 = this.selectedSeat && this.selectedSeat.gIdx === gIdx && this.selectedSeat.sIdx === 1;

            card.innerHTML = `
              <div class="group-header"><span class="group-title">${gIdx + 1}모둠</span><span class="badge">2명</span></div>
              <div class="seats-container">
                <div class="seat ${isSelected0 ? 'selected' : ''}" onclick="App.handleSeatClick(${gIdx}, 0)">
                  <div class="seat-label">좌</div><div class="seat-num">${group[0].num}</div><div class="seat-name">${group[0].name}</div>
                </div>
                <div class="seat ${isSelected1 ? 'selected' : ''}" onclick="App.handleSeatClick(${gIdx}, 1)">
                  <div class="seat-label">우</div><div class="seat-num">${group[1].num}</div><div class="seat-name">${group[1].name}</div>
                </div>
              </div>`;
          } else {
            const isSelected0 = this.selectedSeat && this.selectedSeat.gIdx === gIdx && this.selectedSeat.sIdx === 0;

            card.innerHTML = `
              <div class="group-header"><span class="group-title">${gIdx + 1}모둠</span><span class="badge">1명</span></div>
              <div class="seats-container">
                <div class="seat single ${isSelected0 ? 'selected' : ''}" onclick="App.handleSeatClick(${gIdx}, 0)">
                  <div class="seat-label">단독</div><div class="seat-num">${group[0].num}</div><div class="seat-name">${group[0].name}</div>
                </div>
              </div>`;
          }
          resultGrid.appendChild(card);
        });
      },

      downloadPNG: function() {
        const area = document.getElementById('captureArea');
        html2canvas(area).then(canvas => {
          const link = document.createElement('a');
          link.download = '좌석배치표.png';
          link.href = canvas.toDataURL();
          link.click();
        });
      }
    };

    window.onload = function() {
      App.initInputs();
      App.run();
    };
  </script>
</body>
</html>
